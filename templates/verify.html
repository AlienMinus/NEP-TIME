{% extends "base.html" %}
{% block title %}Verify Email OTP · NEP-TIME ABIT{% endblock %}

{% block content %}
<div class="auth-wrap py-4">
    <div class="auth-card p-4 p-md-5 rounded-4 shadow-md bg-white">
        <div class="text-center mb-4">
            <div class="logo-mark mb-3 shadow-xs">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1">Verify Your Email</h2>
            <p class="text-muted small">We sent a 6-digit verification code to<br><strong class="text-dark">{{ email }}</strong></p>
        </div>

        <form method="post" class="mb-3">
            <div class="mb-3">
                <label class="form-label fw-semibold text-muted small text-center d-block">Enter 6-Digit OTP</label>
                <input name="otp" maxlength="6" inputmode="numeric" class="form-control form-control-lg text-center letter-space bg-light fw-bold fs-4" placeholder="000000" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-muted small">Create Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" minlength="6" class="form-control bg-light border-start-0" placeholder="Minimum 6 characters" required>
                </div>
            </div>

            <button type="submit" class="btn btn-leaf w-100 py-2 rounded-3 fw-semibold shadow-sm">
                <i class="bi bi-check2-circle me-2"></i> Verify & Complete Registration
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Didn't receive the code? Check spam or <a href="{{ url_for('auth.register') }}" class="text-leaf fw-bold text-decoration-none">Try again</a></small>
        </div>
    </div>
</div>
{% endblock %}
